<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Seguimiento de Pedido - Subliprom</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #0f172a;
        min-height: 100vh;
        color: #e2e8f0;
        padding: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .card {
        background: #1e293b;
        border-radius: 20px;
        box-shadow:
          0 8px 32px rgba(0, 0, 0, 0.4),
          0 0 0 1px rgba(255, 255, 255, 0.05);
        max-width: 480px;
        width: 100%;
        margin: 0 auto;
        overflow: hidden;
      }
      .header {
        background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
        padding: 28px 24px 20px;
        position: relative;
        overflow: hidden;
        text-align: center;
      }
      .header::after {
        content: "";
        position: absolute;
        top: -50%;
        right: -30%;
        width: 200px;
        height: 200px;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 50%;
      }
      .logo {
        height: 56px;
        width: auto;
        margin-bottom: 16px;
      }
      .order-title {
        font-size: 22px;
        font-weight: 700;
        line-height: 1.2;
        margin-bottom: 12px;
        color: #fff;
      }
      .token-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: rgba(255, 255, 255, 0.12);
        backdrop-filter: blur(8px);
        border-radius: 100px;
        padding: 5px 14px;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 1px;
        color: rgba(255, 255, 255, 0.9);
      }
      .body {
        padding: 24px;
      }
      .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 7px 18px;
        border-radius: 100px;
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 4px;
      }
      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
      }
      .status-dot.pulse {
        animation: pulse 2s ease-in-out infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.5;
          transform: scale(1.4);
        }
      }
      .section-label {
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        color: #64748b;
        margin: 28px 0 14px;
      }

      /* Timeline */
      .timeline {
        display: flex;
        align-items: flex-start;
        padding: 20px 0 8px;
        position: relative;
      }
      .step {
        display: flex;
        flex-direction: column;
        align-items: center;
        flex: 1;
        position: relative;
      }
      .step-circle {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.4s ease;
        position: relative;
        z-index: 1;
      }
      .step-circle.done {
        background: #22c55e;
        border: 2px solid #22c55e;
        box-shadow: 0 0 12px rgba(34, 197, 94, 0.3);
      }
      .step-circle.active {
        background: #1e293b;
        border: 2px solid #22c55e;
        position: relative;
      }
      .step-circle.active::before,
      .step-circle.active::after {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        border: 2px solid rgba(34, 197, 94, 0.5);
        transform: translate(-50%, -50%) scale(1);
        animation: radar 2s ease-out infinite;
      }
      .step-circle.active::after {
        animation-delay: 1s;
      }
      @keyframes radar {
        0% {
          transform: translate(-50%, -50%) scale(1);
          opacity: 0.8;
        }
        100% {
          transform: translate(-50%, -50%) scale(2.2);
          opacity: 0;
        }
      }
      .step-circle.active .active-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #22c55e;
        box-shadow: 0 0 8px rgba(34, 197, 94, 0.6);
        animation: dot-pulse 2s ease-in-out infinite;
        z-index: 2;
        position: relative;
      }
      @keyframes dot-pulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.2);
        }
      }
      .step-circle.pending {
        background: #1e293b;
        border: 2px solid #334155;
      }
      .step-circle.canceled {
        background: #1e293b;
        border: 2px solid #7f1d1d;
      }
      .step-circle svg {
        width: 16px;
        height: 16px;
      }
      .step-label {
        margin-top: 10px;
        font-size: 11px;
        text-align: center;
        font-weight: 500;
        color: #64748b;
        transition: color 0.3s;
      }
      .step-label.done {
        color: #86efac;
        font-weight: 600;
      }
      .step-label.active {
        color: #86efac;
        font-weight: 700;
      }
      .step-label.canceled {
        color: #fca5a5;
        text-decoration: line-through;
      }
      .connector {
        height: 2px;
        flex: 0.5;
        margin-top: 17px;
        border-radius: 1px;
        transition: background 0.4s;
      }

      /* Info grid */
      .info-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .info-item {
        background: #0f172a;
        border-radius: 12px;
        padding: 12px 14px;
        border: 1px solid #1e293b;
      }
      .info-item .label {
        font-size: 9px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: #64748b;
        margin-bottom: 4px;
      }
      .info-item .value {
        font-size: 14px;
        font-weight: 600;
        color: #e2e8f0;
      }
      .area-badge {
        display: inline-block;
        background: rgba(59, 130, 246, 0.15);
        color: #93c5fd;
        border-radius: 8px;
        padding: 3px 10px;
        font-size: 12px;
        font-weight: 600;
      }
      .footer {
        text-align: center;
        padding: 20px 24px 28px;
        border-top: 1px solid rgba(255, 255, 255, 0.05);
      }
      .footer .brand {
        font-size: 12px;
        font-weight: 600;
        color: #3b82f6;
        margin-bottom: 2px;
      }
      .footer .sub {
        font-size: 11px;
        color: #475569;
      }
      .update-text {
        font-size: 11px;
        color: #475569;
        margin-top: 22px;
        text-align: center;
      }
      .canceled-msg {
        text-align: center;
        padding: 20px 0;
        color: #fca5a5;
        font-size: 14px;
        font-weight: 600;
      }

      /* Loading */
      .loading {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 80px 24px;
        text-align: center;
      }
      .spinner {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        border: 3px solid #334155;
        border-top-color: #3b82f6;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .loading-text {
        margin-top: 16px;
        font-size: 13px;
        color: #475569;
      }

      /* Error */
      .error {
        text-align: center;
        padding: 48px 32px;
      }
      .error-icon {
        font-size: 48px;
        margin-bottom: 16px;
      }
      .error h1 {
        font-size: 20px;
        font-weight: 700;
        margin-bottom: 8px;
        color: #e2e8f0;
      }
      .error p {
        font-size: 14px;
        color: #64748b;
        line-height: 1.6;
      }

      @media (max-width: 360px) {
        .info-grid {
          grid-template-columns: 1fr;
        }
        .order-title {
          font-size: 18px;
        }
      }
    </style>
  </head>
  <body>
    <div class="card" id="app">
      <div class="loading">
        <div class="spinner"></div>
        <p class="loading-text">Cargando pedido...</p>
      </div>
    </div>
    <script>
      var API =
        "https://dfkmoohszzkqouehkoff.supabase.co/functions/v1/order-tracking";
      var token = new URLSearchParams(window.location.search).get("token");
      var LOGO = "logo.png";

      function esc(s) {
        if (!s) return "";
        var d = document.createElement("div");
        d.textContent = s;
        return d.innerHTML;
      }
      function fmtDate(s) {
        if (!s) return "\u2014";
        return new Date(s).toLocaleDateString("es-HN", {
          day: "numeric",
          month: "long",
          year: "numeric",
        });
      }
      function relTime(s) {
        if (!s) return "";
        var m = Math.floor((Date.now() - new Date(s).getTime()) / 60000);
        if (m < 1) return "hace un momento";
        if (m < 60) return "hace " + m + " min";
        var h = Math.floor(m / 60);
        if (h < 24) return "hace " + h + "h";
        return "hace " + Math.floor(h / 24) + "d";
      }

      var checkSvg =
        '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
      var xSvg =
        '<svg viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';

      function render(o) {
        var canceled = o.status === "Cancelado";
        var completed = o.status === "Completado";
        var enProceso = o.status === "En Proceso";
        var step = canceled ? -1 : completed ? 3 : enProceso ? 1 : 0;

        var sc, sb, sl;
        if (canceled) {
          sc = "#ef4444";
          sb = "rgba(239,68,68,.1)";
          sl = "Cancelado";
        } else if (completed) {
          sc = "#22c55e";
          sb = "rgba(34,197,94,.1)";
          sl = "Completado";
        } else if (enProceso) {
          sc = "#f59e0b";
          sb = "rgba(245,158,11,.1)";
          sl = "En Proceso";
        } else {
          sc = "#3b82f6";
          sb = "rgba(59,130,246,.1)";
          sl = "Pendiente";
        }

        var names = ["Recibido", "En Proceso", "Completado"];
        var tl = "";

        if (canceled) {
          tl = '<div class="timeline">';
          for (var i = 0; i < 3; i++) {
            tl +=
              '<div class="step"><div class="step-circle canceled">' +
              xSvg +
              "</div>";
            tl +=
              '<span class="step-label canceled">' + names[i] + "</span></div>";
            if (i < 2)
              tl += '<div class="connector" style="background:#7f1d1d"></div>';
          }
          tl += '</div><p class="canceled-msg">Este pedido fue cancelado</p>';
        } else {
          tl = '<div class="timeline">';
          for (var i = 0; i < 3; i++) {
            var done = i < step,
              act = i === step;
            var cls = done ? "done" : act ? "active" : "pending";
            var inner = "";
            if (done) inner = checkSvg;
            else if (act) inner = '<div class="active-dot"></div>';

            tl +=
              '<div class="step"><div class="step-circle ' +
              cls +
              '">' +
              inner +
              "</div>";
            tl +=
              '<span class="step-label ' +
              cls +
              '">' +
              names[i] +
              "</span></div>";
            if (i < 2) {
              var lc = done ? "#22c55e" : "#334155";
              tl +=
                '<div class="connector" style="background:' + lc + '"></div>';
            }
          }
          tl += "</div>";
        }

        document.title = "Pedido " + esc(o.tracking_token) + " - Subliprom";
        var h = '<div class="header">';
        h +=
          '<img src="' +
          LOGO +
          '" alt="Subliprom" class="logo" onerror="this.style.display=\'none\'">';
        h += '<div class="order-title">' + esc(o.order_name) + "</div>";
        h +=
          '<div class="token-badge">&#127991; ' +
          esc(o.tracking_token) +
          "</div></div>";

        var b = '<div class="body">';
        b +=
          '<div class="status-pill" style="background:' +
          sb +
          ";color:" +
          sc +
          '">';
        b +=
          '<div class="status-dot' +
          (!canceled && !completed ? " pulse" : "") +
          '" style="background:' +
          sc +
          '"></div>' +
          esc(sl) +
          "</div>";
        b += '<div class="section-label">Progreso del pedido</div>' + tl;
        b += '<div class="section-label">Detalles</div>';
        b += '<div class="info-grid">';
        b +=
          '<div class="info-item"><div class="label">Cliente</div><div class="value">' +
          (esc(o.client_name) || "\u2014") +
          "</div></div>";
        b +=
          '<div class="info-item"><div class="label">\u00c1rea</div><div class="value"><span class="area-badge">' +
          (esc(o.work_area) || "\u2014") +
          "</span></div></div>";
        b +=
          '<div class="info-item"><div class="label">Entrega estimada</div><div class="value">' +
          (o.scheduled_at ? fmtDate(o.scheduled_at) : "\u2014") +
          "</div></div>";
        b +=
          '<div class="info-item"><div class="label">Recibido</div><div class="value">' +
          fmtDate(o.created_at) +
          "</div></div>";
        b += "</div>";
        b +=
          '<p class="update-text">Actualizado ' +
          relTime(o.updated_at) +
          " &middot; Se actualiza cada 60s</p></div>";

        var f =
          '<div class="footer"><div class="brand">Subliprom</div><div class="sub">¡Gracias por elegirnos!</div></div>';

        document.getElementById("app").innerHTML = h + b + f;
      }

      function showError() {
        document.getElementById("app").innerHTML =
          '<div class="error"><div class="error-icon">&#128269;</div><h1>Pedido no encontrado</h1><p>No encontramos tu pedido. Verific\u00e1 el enlace o contact\u00e1 al taller.</p><div style="margin-top:32px;font-size:12px;font-weight:600;color:#3b82f6">Subliprom</div></div>';
      }

      function load() {
        if (!token) {
          showError();
          return;
        }
        fetch(API + "?token=" + encodeURIComponent(token))
          .then(function (r) {
            if (!r.ok) throw new Error();
            return r.json();
          })
          .then(function (d) {
            if (d.error) {
              showError();
            } else {
              render(d);
            }
          })
          .catch(function () {
            showError();
          });
      }
      load();
      setInterval(load, 60000);
    </script>
  </body>
</html>
