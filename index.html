<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Seguimiento de Pedido - Subliprom</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
          "Segoe UI", Roboto, sans-serif;
        background: #050505;
        min-height: 100vh;
        color: #f5f5f7;
        padding: 20px 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        -webkit-font-smoothing: antialiased;
      }
      .bg {
        position: fixed;
        inset: 0;
        z-index: 0;
        background: url("bg.png") center/cover no-repeat;
        opacity: 0.35;
      }
      .card {
        position: relative;
        z-index: 1;
        background: rgba(28, 28, 30, 0.82);
        backdrop-filter: blur(40px) saturate(1.5);
        -webkit-backdrop-filter: blur(40px) saturate(1.5);
        border-radius: 22px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        max-width: 420px;
        width: 100%;
        overflow: hidden;
      }
      .header {
        padding: 32px 28px 24px;
        text-align: center;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      }
      .logo {
        height: 48px;
        width: auto;
        margin-bottom: 20px;
      }
      .order-name {
        font-size: 20px;
        font-weight: 600;
        letter-spacing: -0.02em;
        color: #f5f5f7;
        margin-bottom: 10px;
        line-height: 1.25;
      }
      .token {
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 0.5px;
        color: rgba(255, 255, 255, 0.4);
      }
      .body {
        padding: 24px 28px 28px;
      }
      .status {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 28px;
      }
      .status-indicator {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        flex-shrink: 0;
      }
      .status-indicator.alive {
        animation: breathe 2.5s ease-in-out infinite;
      }
      @keyframes breathe {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.35;
        }
      }
      .status-text {
        font-size: 14px;
        font-weight: 500;
      }
      .timeline {
        margin-bottom: 32px;
      }
      .timeline-step {
        display: flex;
        align-items: flex-start;
        gap: 16px;
        position: relative;
        min-height: 52px;
      }
      .timeline-step:last-child {
        min-height: auto;
      }
      .timeline-track {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 24px;
        flex-shrink: 0;
        padding-top: 2px;
      }
      .timeline-dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        flex-shrink: 0;
        position: relative;
        z-index: 1;
        transition: all 0.3s ease;
      }
      .timeline-dot.done {
        background: #30d158;
      }
      .timeline-dot.active {
        background: #30d158;
        box-shadow: 0 0 0 4px rgba(48, 209, 88, 0.2);
      }
      .timeline-dot.active::after {
        content: "";
        position: absolute;
        inset: -6px;
        border-radius: 50%;
        border: 1.5px solid rgba(48, 209, 88, 0.3);
        animation: ring 2.5s ease-out infinite;
      }
      @keyframes ring {
        0% {
          transform: scale(1);
          opacity: 0.6;
        }
        100% {
          transform: scale(2);
          opacity: 0;
        }
      }
      .timeline-dot.pending {
        background: rgba(255, 255, 255, 0.12);
      }
      .timeline-dot.canceled {
        background: #ff453a;
      }
      .timeline-line {
        width: 1.5px;
        flex: 1;
        min-height: 28px;
        margin: 4px 0;
        transition: background 0.3s ease;
      }
      .timeline-content {
        padding-top: 0;
        flex: 1;
      }
      .timeline-label {
        font-size: 14px;
        font-weight: 500;
        line-height: 1;
        transition: color 0.3s ease;
      }
      .timeline-label.done,
      .timeline-label.active {
        color: #f5f5f7;
      }
      .timeline-label.pending {
        color: rgba(255, 255, 255, 0.3);
      }
      .timeline-label.canceled {
        color: #ff453a;
        text-decoration: line-through;
      }
      .timeline-sub {
        font-size: 12px;
        color: rgba(255, 255, 255, 0.3);
        margin-top: 4px;
      }
      .details {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .detail-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .detail-label {
        font-size: 13px;
        color: rgba(255, 255, 255, 0.4);
        font-weight: 400;
      }
      .detail-value {
        font-size: 13px;
        color: #f5f5f7;
        font-weight: 500;
        text-align: right;
      }
      .area-chip {
        display: inline-block;
        background: rgba(48, 209, 88, 0.1);
        color: #30d158;
        border-radius: 6px;
        padding: 2px 8px;
        font-size: 12px;
        font-weight: 500;
      }
      .separator {
        height: 1px;
        background: rgba(255, 255, 255, 0.06);
        margin: 4px 0;
      }
      .footer {
        padding: 20px 28px;
        border-top: 1px solid rgba(255, 255, 255, 0.06);
        text-align: center;
      }
      .footer-text {
        font-size: 11px;
        color: rgba(255, 255, 255, 0.2);
      }
      .updated {
        font-size: 11px;
        color: rgba(255, 255, 255, 0.2);
        text-align: center;
        margin-top: 20px;
      }
      .canceled-banner {
        text-align: center;
        padding: 12px 0;
        font-size: 13px;
        font-weight: 500;
        color: #ff453a;
      }
      .loading {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 80px 28px;
        text-align: center;
      }
      .spinner {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        border: 2.5px solid rgba(255, 255, 255, 0.1);
        border-top-color: rgba(255, 255, 255, 0.6);
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .loading p {
        margin-top: 16px;
        font-size: 13px;
        color: rgba(255, 255, 255, 0.3);
      }
      .error-page {
        text-align: center;
        padding: 56px 28px;
      }
      .error-page h1 {
        font-size: 18px;
        font-weight: 600;
        margin-bottom: 6px;
      }
      .error-page p {
        font-size: 14px;
        color: rgba(255, 255, 255, 0.4);
        line-height: 1.5;
      }
      @media (max-width: 360px) {
        .order-name {
          font-size: 17px;
        }
      }
    </style>
  </head>
  <body>
    <div class="bg"></div>
    <div class="card" id="app">
      <div class="loading">
        <div class="spinner"></div>
        <p>Cargando...</p>
      </div>
    </div>
    <script>
      var API =
        "https://dfkmoohszzkqouehkoff.supabase.co/functions/v1/order-tracking";
      var token = new URLSearchParams(window.location.search).get("token");

      function esc(s) {
        if (!s) return "";
        var d = document.createElement("div");
        d.textContent = s;
        return d.innerHTML;
      }
      function fmtDate(s) {
        if (!s) return "\u2014";
        return new Date(s).toLocaleDateString("es-HN", {
          day: "numeric",
          month: "short",
          year: "numeric",
        });
      }
      function relTime(s) {
        if (!s) return "";
        var m = Math.floor((Date.now() - new Date(s).getTime()) / 60000);
        if (m < 1) return "Ahora";
        if (m < 60) return "Hace " + m + " min";
        var h = Math.floor(m / 60);
        if (h < 24) return "Hace " + h + "h";
        return "Hace " + Math.floor(h / 24) + "d";
      }

      function render(o) {
        var canceled = o.status === "Cancelado",
          completed = o.status === "Completado",
          enProceso = o.status === "En Proceso";
        var step = canceled ? -1 : completed ? 3 : enProceso ? 1 : 0;
        var sc = canceled
          ? "#ff453a"
          : completed
            ? "#30d158"
            : enProceso
              ? "#ff9f0a"
              : "#0a84ff";
        var sl = canceled
          ? "Cancelado"
          : completed
            ? "Completado"
            : enProceso
              ? "En proceso"
              : "Pendiente";
        var alive = !canceled && !completed;

        var steps = [
          { name: "Recibido", sub: fmtDate(o.created_at) },
          { name: "En Proceso", sub: "En taller" },
          {
            name: "Completado",
            sub: o.scheduled_at ? "Est. " + fmtDate(o.scheduled_at) : "",
          },
        ];

        var tl = "";
        for (var i = 0; i < steps.length; i++) {
          var done = !canceled && i < step,
            act = !canceled && i === step,
            cn = canceled
              ? "canceled"
              : done
                ? "done"
                : act
                  ? "active"
                  : "pending";
          var lineColor = done ? "rgba(48,209,88,.4)" : "rgba(255,255,255,.06)";
          var showLine = i < steps.length - 1;
          tl += '<div class="timeline-step"><div class="timeline-track">';
          tl += '<div class="timeline-dot ' + cn + '"></div>';
          if (showLine)
            tl +=
              '<div class="timeline-line" style="background:' +
              lineColor +
              '"></div>';
          tl += '</div><div class="timeline-content">';
          tl +=
            '<div class="timeline-label ' +
            cn +
            '">' +
            steps[i].name +
            "</div>";
          if (steps[i].sub && (done || act))
            tl += '<div class="timeline-sub">' + steps[i].sub + "</div>";
          tl += "</div></div>";
        }
        if (canceled)
          tl += '<div class="canceled-banner">Este pedido fue cancelado</div>';

        document.title =
          "Pedido " + esc(o.tracking_token) + " \u2014 Subliprom";
        var html = '<div class="header">';
        html +=
          '<img src="logo.png" alt="Subliprom" class="logo" onerror="this.style.display=\'none\'">';
        html += '<div class="order-name">' + esc(o.order_name) + "</div>";
        html += '<div class="token">' + esc(o.tracking_token) + "</div></div>";
        html += '<div class="body">';
        html +=
          '<div class="status"><div class="status-indicator' +
          (alive ? " alive" : "") +
          '" style="background:' +
          sc +
          '"></div>';
        html +=
          '<div class="status-text" style="color:' +
          sc +
          '">' +
          sl +
          "</div></div>";
        html += '<div class="timeline">' + tl + "</div>";
        html += '<div class="details">';
        html +=
          '<div class="detail-row"><span class="detail-label">Cliente</span><span class="detail-value">' +
          (esc(o.client_name) || "\u2014") +
          "</span></div>";
        html += '<div class="separator"></div>';
        html +=
          '<div class="detail-row"><span class="detail-label">\u00c1rea de trabajo</span><span class="detail-value"><span class="area-chip">' +
          (esc(o.work_area) || "\u2014") +
          "</span></span></div>";
        html += '<div class="separator"></div>';
        html +=
          '<div class="detail-row"><span class="detail-label">Entrega estimada</span><span class="detail-value">' +
          (o.scheduled_at ? fmtDate(o.scheduled_at) : "\u2014") +
          "</span></div>";
        html += '<div class="separator"></div>';
        html +=
          '<div class="detail-row"><span class="detail-label">Recibido</span><span class="detail-value">' +
          fmtDate(o.created_at) +
          "</span></div>";
        html += "</div>";
        html +=
          '<div class="updated">' +
          relTime(o.updated_at) +
          " \u00b7 Actualiza cada 60s</div></div>";
        html +=
          '<div class="footer"><div class="footer-text">Subliprom \u00b7 Sublimaci\u00f3n, bordado y banners</div></div>';
        document.getElementById("app").innerHTML = html;
      }

      function showError() {
        document.getElementById("app").innerHTML =
          '<div class="error-page"><h1>Pedido no encontrado</h1><p>Verific\u00e1 el enlace o contact\u00e1 al taller.</p></div>';
      }

      function load() {
        if (!token) {
          showError();
          return;
        }
        fetch(API + "?token=" + encodeURIComponent(token))
          .then(function (r) {
            if (!r.ok) throw new Error();
            return r.json();
          })
          .then(function (d) {
            if (d.error) {
              showError();
            } else {
              render(d);
            }
          })
          .catch(function () {
            showError();
          });
      }
      load();
      setInterval(load, 60000);
    </script>
  </body>
</html>
